<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17191b">
    <title>RoadScan — Phân tích hư hỏng mặt đường</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Điều hướng chính">
        <a class="brand" href="#/" aria-label="RoadScan, trang dự đoán ảnh">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path d="M10 4h12l6 24H4L10 4Z" fill="currentColor"/><path d="m16 8-.7 4.2m-1.4 6.5-.8 4.4" stroke="#17191B" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="3 3"/></svg>
          </span>
          <span><strong>RoadScan</strong><small>Road damage detection</small></span>
        </a>

        <div class="side-label">KHÔNG GIAN LÀM VIỆC</div>
        <nav class="primary-nav">
          <a class="nav-link" href="#/" data-route="/" aria-current="page">
            <span class="nav-icon" aria-hidden="true">▧</span><span>Dự đoán ảnh</span>
          </a>
          <a class="nav-link" href="#/video" data-route="/video">
            <span class="nav-icon" aria-hidden="true">▷</span><span>Dự đoán video</span>
          </a>
          <a class="nav-link" href="#/experiments" data-route="/experiments">
            <span class="nav-icon" aria-hidden="true">⌁</span><span>So sánh thí nghiệm</span>
          </a>
          <a class="nav-link" href="#/evaluation" data-route="/evaluation">
            <span class="nav-icon" aria-hidden="true">◫</span><span>Đánh giá mô hình</span>
          </a>
        </nav>

        <div class="sidebar-spacer"></div>
        <section class="class-legend" aria-label="Danh sách lớp nhận diện">
          <div class="side-label">LỚP NHẬN DIỆN</div>
          <div class="legend-item"><span class="class-dot pothole"></span><span><strong>0</strong> Pothole</span></div>
          <div class="legend-item"><span class="class-dot crack"></span><span><strong>1</strong> Crack</span></div>
          <div class="legend-item"><span class="class-dot manhole"></span><span><strong>2</strong> Manhole</span></div>
        </section>
        <div class="sidebar-foot"><span class="status-pip"></span> Môi trường cục bộ <span class="mono">· CPU</span></div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>RoadScan</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Dự đoán ảnh</strong></div>
          <div class="topbar-right"><span class="local-badge"><span class="status-pip"></span> Đang chạy cục bộ</span><span class="avatar" aria-label="Người dùng">RS</span></div>
        </header>
        <div id="app" class="page-content" aria-live="polite"></div>
      </main>
    </div>
  </body>
</html>
