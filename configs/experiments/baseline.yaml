# Experiment: Baseline (Minimal Letterbox Resize to 640x640)
experiment_name: "A_raw"
description: "Reference baseline: raw valid RGB only; Ultralytics applies standard letterbox and normalization."

resize:
  enabled: false
  mode: "letterbox"
  target_size: [640, 640]
  pad_color: [114, 114, 114]

denoise:
  enabled: false

contrast:
  enabled: false

brightness:
  enabled: false
  brightness_factor: 1.0

normalization:
  enabled: false
  mode: "none"

augmentation:
  enabled: false
