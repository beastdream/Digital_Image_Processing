# Experiment: Baseline (Minimal Letterbox Resize to 640x640)
experiment_name: "baseline"
description: "Minimal baseline: Letterbox resize to 640x640 with standard pixel normalization."

resize:
  enabled: true
  mode: "letterbox"
  target_size: [640, 640]
  pad_color: [114, 114, 114]

denoise:
  enabled: false

contrast:
  enabled: false

brightness:
  enabled: false
  brightness_factor: 1.0

normalization:
  enabled: true
  mode: "pixel_scale"

augmentation:
  enabled: false
