# Experiment: Training Data Augmentation
experiment_name: "augmentation"
description: "Evaluates geometric and color data augmentation for training robustness."

resize:
  enabled: true
  mode: "letterbox"
  target_size: [640, 640]

denoise:
  enabled: false

contrast:
  enabled: false

brightness:
  enabled: false

normalization:
  enabled: true
  mode: "pixel_scale"

augmentation:
  enabled: true
  horizontal_flip:
    prob: 0.5
  rotation:
    prob: 0.3
    max_angle_deg: 8
  scaling:
    prob: 0.3
    scale_range: [0.9, 1.1]
  translation:
    prob: 0.3
    translate_range: [0.03, 0.03]
  brightness_contrast:
    prob: 0.4
    brightness_range: [0.9, 1.1]
    contrast_range: [0.9, 1.1]
  gamma:
    prob: 0.3
    gamma_range: [0.9, 1.1]
  blur_noise:
    prob: 0.0
    blur_kernel: 3
    noise_std: 5.0
