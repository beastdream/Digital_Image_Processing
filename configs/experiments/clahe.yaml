# Experiment: Contrast Enhancement (CLAHE)
experiment_name: "D_clahe"
description: "Evaluates CLAHE contrast enhancement for highlighting subtle asphalt cracks and shadow area potholes."

resize:
  enabled: true
  mode: "letterbox"
  target_size: [640, 640]

denoise:
  enabled: false

contrast:
  enabled: true
  method: "clahe"
  clahe_clip_limit: 2.5
  clahe_tile_grid_size: [8, 8]

brightness:
  enabled: false

normalization:
  enabled: true
  mode: "pixel_scale"

augmentation:
  enabled: false
