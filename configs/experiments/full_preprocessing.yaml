# Experiment: Full Preprocessing Pipeline
experiment_name: "full_preprocessing"
description: "Combines Letterbox Resize, Denoising, CLAHE, Brightness Adjustment, Normalization, and Training Augmentation."

resize:
  enabled: true
  mode: "letterbox"
  target_size: [640, 640]
  pad_color: [114, 114, 114]

denoise:
  enabled: true
  method: "gaussian"
  gaussian_kernel: [3, 3]
  gaussian_sigma: 0.5

contrast:
  enabled: true
  method: "clahe"
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]

brightness:
  enabled: true
  brightness_factor: 1.05

normalization:
  enabled: true
  mode: "pixel_scale"

augmentation:
  enabled: true
  horizontal_flip:
    prob: 0.5
  rotation:
    prob: 0.3
    max_angle_deg: 8
  scaling:
    prob: 0.3
    scale_range: [0.9, 1.1]
  translation:
    prob: 0.3
    translate_range: [0.03, 0.03]
  brightness_contrast:
    prob: 0.3
    brightness_range: [0.9, 1.1]
    contrast_range: [0.9, 1.1]
  blur_noise:
    prob: 0.2
    blur_kernel: 3
    noise_std: 3.0
