# Experiment: Full Preprocessing Pipeline
experiment_name: "F_combined"
description: "Combines Gaussian denoising, CLAHE, and brightness. Training augmentation is controlled identically by yolo_training.yaml for every experiment."

resize:
  enabled: true
  mode: "letterbox"
  target_size: [640, 640]
  pad_color: [114, 114, 114]

denoise:
  enabled: true
  method: "gaussian"
  gaussian_kernel: [3, 3]
  gaussian_sigma: 0.5

contrast:
  enabled: true
  method: "clahe"
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]

brightness:
  enabled: true
  brightness_factor: 1.05

normalization:
  enabled: true
  mode: "pixel_scale"

augmentation:
  enabled: false
