# YOLO Training Configuration for Road Damage Detection

# Model Weights
model_weights: "yolov8n.pt"
model_size: "nano"

# Dataset
data_yaml: "data/processed/road_damage_detection/dataset.yaml"

# Hyperparameters
imgsz: 320
epochs: 10
batch: 16
fraction: 0.5
optimizer: "Auto"
learning_rate: 0.01
patience: 10
seed: 42
cache: false

# Online training augmentation only. It changes geometry/appearance but never
# class IDs; validation and test are not augmented by Ultralytics.
degrees: 8.0
translate: 0.03
scale: 0.10
fliplr: 0.5
hsv_h: 0.01
hsv_s: 0.2
hsv_v: 0.15

# Hardware / Environment
device: "cpu"
workers: 0

# Output & Logging
project: "experiments/yolo"
name: "baseline"
exist_ok: true
save: true
save_period: -1
plots: true
verbose: true
