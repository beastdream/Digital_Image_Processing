# YOLO Training Configuration for Road Damage Detection

# Model Weights
model_weights: "yolov8n.pt"
model_size: "nano"

# Dataset
data_yaml: "data/processed/road_damage_detection/dataset.yaml"
preprocessing_config: "configs/experiments/baseline.yaml"

# Hyperparameters
imgsz: 640
epochs: 10
batch: 16
# Final comparison always uses the complete training split.
fraction: 1.0
debug_only: false
optimizer: "Auto"
learning_rate: 0.01
patience: 10
seed: 42
cache: false

# Online training augmentation only. It changes geometry/appearance but never
# class IDs; validation and test are not augmented by Ultralytics.
degrees: 8.0
translate: 0.03
scale: 0.10
fliplr: 0.5
hsv_h: 0.01
hsv_s: 0.2
hsv_v: 0.15
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0

# Hardware / Environment
device: "cpu"
workers: 0

# Output & Logging
project: "experiments/yolo"
name: "A_raw"
exist_ok: true
save: true
save_period: -1
plots: true
verbose: true
