augmentation:
  blur_noise:
    blur_kernel: 3
    noise_std: 3.0
    prob: 0.2
  brightness_contrast:
    brightness_range:
    - 0.9
    - 1.1
    contrast_range:
    - 0.9
    - 1.1
    prob: 0.3
  enabled: true
  horizontal_flip:
    prob: 0.5
  rotation:
    max_angle_deg: 8
    prob: 0.3
  scaling:
    prob: 0.3
    scale_range:
    - 0.9
    - 1.1
  translation:
    prob: 0.3
    translate_range:
    - 0.03
    - 0.03
brightness:
  brightness_factor: 1.05
  enabled: true
contrast:
  clahe_clip_limit: 2.0
  clahe_tile_grid_size:
  - 8
  - 8
  enabled: true
  method: clahe
denoise:
  enabled: true
  gaussian_kernel:
  - 3
  - 3
  gaussian_sigma: 0.5
  method: gaussian
description: Combines Letterbox Resize, Denoising, CLAHE, Brightness Adjustment, Normalization,
  and Training Augmentation.
experiment_name: full_preprocessing
normalization:
  enabled: true
  mode: pixel_scale
resize:
  enabled: true
  mode: letterbox
  pad_color:
  - 114
  - 114
  - 114
  target_size:
  - 640
  - 640
